<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Plane Model</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="info">
        <h1>3D Plane Model</h1>
        <p>Third-person view of a plane on a runway</p>
        <p>Controls: W to accelerate, Arrow Down to pitch up, Arrow Up to pitch down</p>
        <p>Takeoff: Accelerate to high speed, then pitch up to fly</p>
        <p>Debug: Press D to toggle orbit controls</p>
        <div id="flight-data">
            <p>Speed: <span id="speed-value">0</span> units/s</p>
            <p>Altitude: <span id="altitude-value">0</span> units</p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
